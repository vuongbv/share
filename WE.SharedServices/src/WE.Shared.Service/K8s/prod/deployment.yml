apiVersion: apps/v1
kind: Deployment
metadata:
  name: wesharedservices
  namespace: wesharedservices
  labels:
    app: wesharedservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wesharedservices
  template:
    metadata:
      labels:
        app: wesharedservices
    spec:     
      containers:
        - name: wesharedservices
          image: acrweiot.azurecr.io/wesharedservices:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: wesharedservices-config
          args:
            - /server
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

---
kind: Service
apiVersion: v1
metadata:
  name: wesharedservices
  namespace: wesharedservices
spec:
  selector:
    app: wesharedservices
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: wesharedservices-ingress
 namespace: wesharedservices
 annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    kubernetes.io/ingress.class: "nginx"
spec:
    tls:
      - hosts:
          - '*.wiredge.ai'
        secretName: hello-app-tls
    rules:
       - host:
         http:
          paths:
            - path: /share/(.*)
              pathType: Prefix
              backend:
                service:
                  name: wesharedservices
                  port:
                    number: 80
status:
  loadBalancer:
    ingress:
      - ip: 20.44.229.185